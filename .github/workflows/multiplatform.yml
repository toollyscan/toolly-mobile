name: Multiplatform CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-android:
    name: Shared core and UI Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Gradle dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.lockfile') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build and test shared Android code
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :shared-core:assembleDebug \
            :shared-core:testDebugUnitTest \
            :shared-ui:assembleDebug \
            :shared-ui:testDebugUnitTest

  shared-ios:
    name: Shared core and UI iOS host build and simulator launch
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select reviewed Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Cache Gradle dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.lockfile') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Kotlin/Native bootstraps its full compiler + platform libraries into ~/.konan
      # on first use -- normally several minutes of download+setup before any actual
      # compilation starts. Persisting it across runs is the single biggest lever for
      # this job's time, independent of the Gradle build cache above.
      - name: Cache Kotlin/Native (.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Test shared code and build simulator/device targets
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :shared-core:iosSimulatorArm64Test \
            :shared-core:compileKotlinIosArm64 \
            :shared-ui:iosSimulatorArm64Test \
            :shared-ui:linkDebugFrameworkIosSimulatorArm64 \
            :shared-ui:linkReleaseFrameworkIosArm64

      - name: Provision Firebase iOS config (dev)
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_DEV }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            # macOS runners ship BSD base64 (-D to decode), not GNU base64 (-d) --
            # python3's stdlib is identical on both runners, so decode there instead
            # of relying on a CLI flag that differs by platform.
            python3 -c "
import base64, os
path = 'iosApp/ToollyApp/GoogleService-Info.plist'
raw = ''.join(os.environ['GOOGLE_SERVICE_INFO_PLIST_B64'].split())
with open(path, 'wb') as f:
    f.write(base64.b64decode(raw))
"
          else
            echo "::warning::FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_DEV secret is not set; Firebase-dependent build steps will fail."
          fi

      - name: Build, install and launch first-party iOS host
        run: |
          chmod +x ./scripts/ios_simulator_smoke.sh
          ./scripts/ios_simulator_smoke.sh

      - name: Publish iOS simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolly-ios-simulator-${{ github.sha }}
          path: build/ios-host/Build/Products/Debug-iphonesimulator/ToollyApp.app
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
