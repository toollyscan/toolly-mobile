name: Multiplatform CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-android:
    name: Shared UI Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test shared Android UI
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :shared-ui:assembleDebug \
            :shared-ui:testDebugUnitTest

  shared-ios:
    name: Shared UI iOS simulator tests and frameworks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select reviewed Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Test simulator and build simulator/device frameworks
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :shared-ui:iosSimulatorArm64Test \
            :shared-ui:linkDebugFrameworkIosSimulatorArm64 \
            :shared-ui:linkReleaseFrameworkIosArm64
