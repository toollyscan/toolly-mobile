name: Multiplatform Governance Refresh

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-governance:
    name: Generate reviewed KMP locks and checksums
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select reviewed Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Resolve Android, common and iOS dependencies
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            --write-verification-metadata sha256 \
            --write-locks \
            :spike-capture:assembleDebug \
            :spike-capture:testDebugUnitTest \
            :shared-ui:allTests \
            :shared-ui:assembleDebug \
            :shared-ui:linkDebugFrameworkIosSimulatorArm64

      - name: Publish generated governance files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolly-kmp-governance-${{ github.sha }}
          path: |
            gradle/verification-metadata.xml
            **/gradle.lockfile
          if-no-files-found: error
          retention-days: 2
