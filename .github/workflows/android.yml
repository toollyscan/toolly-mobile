name: Android CI

on:
  push:
    branches: ["navigation3-packmate"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Materialize source on the bootstrap commit
        id: materialize
        shell: bash
        run: |
          if compgen -G ".bootstrap/part-*" > /dev/null; then
            cat .bootstrap/part-* | base64 --decode > /tmp/packmate-source.tar.gz
            tar -xzf /tmp/packmate-source.tar.gz
            rm -rf .bootstrap
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit materialized project
        if: steps.materialize.outputs.changed == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PackMate Navigation 3 sample app"
          git push

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: packmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
