name: ZZ Diagnostic
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  hello:
    name: Hello
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Heredoc-to-file alternative test
        run: |
          cat > /tmp/decode.py <<'PYEOF'
          print('hi')
          PYEOF
          python3 /tmp/decode.py

      - run: echo "hello"
