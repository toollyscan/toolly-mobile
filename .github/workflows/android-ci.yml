name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-build:
    name: Android build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Gradle dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.lockfile') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Provision Firebase Android config (dev)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_DEV }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            # Decode via python3, not the base64 CLI: GNU base64 -d rejected the
            # secret outright ("base64: invalid input") -- almost certainly stray
            # CR characters picked up when the value was copied from a Windows
            # clipboard. Stripping all whitespace before decoding sidesteps that
            # regardless of which line-ending convention produced it, and matches
            # the decode approach multiplatform-ci.yml's iOS job already needs for
            # its own (different) cross-platform base64 CLI problem.
            #
            # The script is written to a file rather than passed as `python3 -c
            # "<multi-line>"` -- a multi-line double-quoted argument split across
            # several lines inside a `run: |` block silently broke GitHub's own
            # workflow registration for this file (zero jobs ever scheduled on
            # push or pull_request, workflow_dispatch rejected as absent, and the
            # workflow's registered name fell back to its raw file path) --
            # confirmed by bisection against a minimal throwaway workflow.
            cat > /tmp/decode_google_services.py <<'PYEOF'
import base64, os
path = 'spike-capture/google-services.json'
raw = ''.join(os.environ['GOOGLE_SERVICES_JSON_B64'].split())
with open(path, 'wb') as f:
    f.write(base64.b64decode(raw))
PYEOF
            python3 /tmp/decode_google_services.py
          else
            echo "::warning::FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_DEV secret is not set; Firebase-dependent build steps will fail."
          fi

      - name: Build, lint and test
        run: |
          python3 scripts/validate_android_permissions.py
          python3 scripts/validate_compose_runtime_alignment.py
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :spike-capture:assembleDebug \
            :spike-capture:assembleDebugAndroidTest \
            :spike-capture:lintDebug \
            :spike-capture:testDebugUnitTest

      - name: Publish phone and tablet test APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolly-capture-spike-${{ github.sha }}
          path: |
            spike-capture/build/outputs/apk/debug/spike-capture-debug.apk
            spike-capture/build/outputs/apk/androidTest/debug/spike-capture-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
