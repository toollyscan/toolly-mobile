name: Documentation CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Consolidated documentation, security and governance gate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate documentation and governance
        run: |
          python3 scripts/validate_markdown.py --self-test
          python3 scripts/validate_markdown.py
          python3 scripts/validate_platform_parity.py --self-test
          python3 scripts/validate_benchmark_evidence.py --self-test
          python3 scripts/validate_dependency_policy.py --self-test
          python3 scripts/validate_dependency_policy.py \
            --emit-sbom /tmp/toolly-governance.cdx.json
          python3 -m json.tool /tmp/toolly-governance.cdx.json >/dev/null
          python3 scripts/validate_firebase_governance.py --self-test
          python3 scripts/validate_ci_trust_policy.py --self-test
          python3 scripts/validate_ci_trust_policy.py
          python3 scripts/scan_secrets.py --self-test
          python3 scripts/scan_secrets.py
